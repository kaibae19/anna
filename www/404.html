<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Anna</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--paper:#eef1f6;--panel:#fff;--ink:#1b1f2e;--muted:#5b6275;--line:#c9cfdc;--spark:#e2456f;--file:#2b7a78;--file-soft:#dcefee}
@media (prefers-color-scheme: dark){:root{--paper:#12151f;--panel:#1a1e2b;--ink:#e8ebf2;--muted:#9aa2b5;--line:#2c3244;--spark:#ff6b8f;--file:#5cc2bd;--file-soft:#173a3a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);font:400 18px/1.55 "Figtree",system-ui,sans-serif}
main{max-width:34rem}
.eyebrow{font:500 13px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--spark)}
h1{font:800 clamp(2rem,6vw,3rem)/1.08 "Bricolage Grotesque",system-ui,sans-serif;margin:.5rem 0 1rem;letter-spacing:-.01em}
p{color:var(--muted);margin:0 0 1.5rem}
nav{display:flex;gap:12px;flex-wrap:wrap}
a{display:inline-block;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-weight:600}
a:hover,a:focus-visible{border-color:var(--file);outline:none}
a.primary{background:var(--file);border-color:var(--file);color:#fff}
</style>
</head>
<body>
<main>
  <span class="eyebrow">404 · not in the record</span>
  <h1>There's no page here.</h1>
  <p>Maybe it moved, or the link has a typo. Anna keeps a moves log for her own files; for this site, the front page and the docs are the two places to start.</p>
  <nav>
    <a class="primary" href="/">Front page</a>
    <a href="/docs/">Docs</a>
    <a href="https://github.com/kaibae19/anna">Anna on GitHub</a>
  </nav>
</main>
</body>
</html>
